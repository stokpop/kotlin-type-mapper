name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/**'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew check
